ticket_id: AE-FEAT-IMPORT-005R
objective: "Compute individual point-in-time ratio log-odds perturbation importance."
goal: "Use bounded GBM-only predictors to compute true model-response perturbation importance for individual point-in-time/base ratio features only."
dependencies:
  - "AE-FEAT-IMPORT-001R point-in-time/base ratio family mapping."
  - "AE-FEAT-IMPORT-004R family-level perturbation outputs and validated mapping evidence."
  - "AE-FEAT-IMPORT-003S complete bounded GBM-only predictor workspace."
allowed_areas:
  - "05_Documentation/09_Epics/AE-FEAT-IMPORT_Feature_Importance/**"
  - "epics/AE-FEAT-IMPORT/**"
  - "03_Data_Output/10_FeatureImportance/**"
may_read:
  - "01_Code/pipeline/06B_FeatureEngineering.R"
  - "01_Code/pipeline/09C_AutoGluon.py"
  - "01_Code/pipeline/config.R"
  - "02_Data_Input/05_PipelineResults/Necessary/**"
  - "03_Data_Output/10_FeatureImportance/predictor_workspace/**"
  - "03_Data_Output/10_FeatureImportance/family_importance/**"
  - "05_Documentation/09_Epics/AE-FEAT-IMPORT_Feature_Importance/**"
must_not_touch:
  - "01_Code/**"
  - "02_Data_Input/**"
  - "06_Presentations/**"
  - "07_CloudComputing/**"
  - "03_Data_Output/** outside 03_Data_Output/10_FeatureImportance/**"
  - "C:/Users/Tristan Leiter/Documents/aegis-core/**"
requirements:
  - "Build a reproducible local computation script under the AE-FEAT-IMPORT documentation folder."
  - "Identify the point-in-time ratio feature list from validated family mapping/evidence."
  - "Load each fitted AutoGluon predictor from the bounded GBM-only predictor workspace."
  - "Use CV/training rows only."
  - "Compute baseline probabilities and logits with probability clipping."
  - "For each individual point-in-time ratio feature, perturb that feature only using deterministic within-CV permutation with a fixed seed."
  - "Compute delta_log_odds = baseline_logit - perturbed_logit."
  - "Run applicable combinations: raw, fund, raw_plus_latent crossed with dynamic_csi and permanent_csi."
  - "Handle latent_raw as not_applicable/no point-in-time features if PIT columns are absent."
  - "Save full outputs locally under ignored 03_Data_Output/10_FeatureImportance/pit_ratio_importance/."
  - "Commit only compact documentation/evidence outputs, not generated 03_Data_Output files."
  - "Include ranked top ratio tables for temporary CSI, permanent CSI, and each applicable feature set."
  - "Include coverage audit for applicable predictors, non-applicable latent_raw predictors, and missing PIT features."
  - "Include interpretation of which base ratios affect temporary and permanent CSI logits and whether ratios recur across raw/fund/raw_plus_latent."
  - "State clearly that results are bounded GBM-only predictor workspace evidence."
non_goals:
  - "No all-feature individual importance."
  - "No point-in-time ratio family recomputation beyond the required individual PIT-ratio subset."
  - "No 09C_AutoGluon.py training."
  - "No 10_Evaluation.R."
  - "No 11C_IndexConstruction_Revised.R."
  - "No sensitivity scripts."
  - "No pipeline regeneration."
  - "No presentation compile."
  - "No branch merge."
  - "No push."
