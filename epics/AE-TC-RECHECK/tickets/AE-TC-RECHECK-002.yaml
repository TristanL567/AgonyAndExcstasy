ticket_id: AE-TC-RECHECK-002
goal: Recompute transaction-cost slide active-alpha values against a zero-cost benchmark.
dependencies:
  - AE-TC-RECHECK-001
allowed_areas:
  - 05_Documentation/09_Epics/AE-TC-RECHECK_Transaction_Cost_Slide_Audit/**
  - epics/AE-TC-RECHECK/**
may_inspect_read_only:
  - 03_Data_Output/7_IndexConstructionValidation/nonraw_index_suite/**
  - 05_Documentation/09_Epics/AE-INDEX-SUITE_Index_Construction/**
  - 05_Documentation/09_Epics/AE-TC-AUDIT_Transaction_Cost_Audit/**
  - 05_Documentation/09_Epics/AE-TC-RECHECK_Transaction_Cost_Slide_Audit/**
  - 06_Presentations/02_FinalPresentation/Necessary/FinalPresentation_June/Draft/**
  - 06_Presentations/02_FinalPresentation/Necessary/FinalPresentation_June/**
must_not_touch:
  - 01_Code/**
  - 02_Data_Input/**
  - 03_Data_Output/**
  - 04_Research/**
  - 06_Presentations/**
