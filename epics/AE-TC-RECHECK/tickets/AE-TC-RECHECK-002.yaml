requirements:
  - Locate the source rows for the eight selected OOS strategies.
  - Recompute zero-cost benchmark geometric return, strategy net geometric return, active alpha versus zero-cost benchmark, difference versus current slide value, turnover, and expected cost drag for 5, 10, and 20 bps.
  - Confirm whether selected OOS winners remain unchanged under the corrected active-alpha definition.
  - Test fixed-strategy monotonicity of active alpha versus the zero-cost benchmark.
  - Produce corrected slide-ready values for 5, 10, and 20 bps.
  - Explain why the market-cap benchmark should remain zero-cost while the strategy pays transaction costs.
  - Do not edit the presentation.
  - Do not rerun index construction, model, evaluation, sensitivity, or pipeline scripts.
non_goals:
  - Editing presentation slides or source maps.
  - Modifying source data or generated index outputs.
  - Rerunning model, index, evaluation, sensitivity, or pipeline jobs.
acceptance_criteria:
  - Required evidence files exist.
  - All 24 requested values are recomputed against the zero-cost benchmark.
  - Monotonicity is confirmed or any failure is explained.
  - Corrected slide-ready values are provided.
  - Winner-ranking conclusion is documented.
  - No presentation or 03_Data_Output files are modified.
  - Staged scope is limited to allowed areas.
manual_verification_required: true
manual_verification_steps:
  - Review the zero-cost benchmark recomputation report.
  - Review corrected slide values and monotonicity CSVs.
verification_commands:
  - git diff --cached --name-only
  - git diff --cached --check
completion_report_required: true
